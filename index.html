        <section id="apercu">
          <h1>Edgar Chaslin</h1>
          <p class="lead">Post-doctoral researcher at <strong>CEA SPEC</strong>,
            Université Paris-Saclay, France.</p>
          <p class="lead">Epitaxial growth and characterisation of ferroelectric
            oxide thin films — BaTiO<sub>3</sub>, (Ba,Sr)TiO<sub>3</sub>,
            (La,Sr)MnO<sub>3</sub>, CeO<sub>2</sub> and MgO — covering the full
            chain from deposition by sputtering, pulsed laser deposition and
            molecular beam epitaxy, through photolithography, to characterisation
            by X-ray diffraction, piezoresponse force microscopy and
            unit-cell-resolved electron microscopy.</p>
